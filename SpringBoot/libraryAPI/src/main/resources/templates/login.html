<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.mintyle" />
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .login-header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background-color: #4f46e5;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            opacity: .95;
        }

        .forgot-password {
            text-decoration: none;
            color: #6c63ff;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card login-card">
    <div class="card-body p-4">

        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-fill"></i>
            </div>
            <h2 class="fw-bold">Bem-vindo</h2>
            <p class="text-muted">Faça login para continuar</p>
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-login">
                    Entrar
                </button>
            </div>
        </form>

    </div>
    </div>

    </body>
</html>
